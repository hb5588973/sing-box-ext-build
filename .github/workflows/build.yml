name: build

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/SagerNet/sing-box.git
  UPSTREAM_BRANCH: testing
  WIREGUARD_REPO: https://github.com/hb5588973/wireguard-go-awg.git
  WIREGUARD_BRANCH: main
  WIREGUARD_PATH: src/submodules/wireguard-go

jobs:
  meta:
    name: Resolve upstream revision and tags
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.meta.outputs.upstream_sha }}
      base_tags: ${{ steps.meta.outputs.base_tags }}
    steps:
      - name: Read upstream revision and default tags
        id: meta
        run: |
          set -euo pipefail
          SHA="$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)"
          BASE_TAGS="$(curl -fsSL "https://raw.githubusercontent.com/SagerNet/sing-box/$UPSTREAM_BRANCH/release/DEFAULT_BUILD_TAGS_OTHERS")"
          echo "upstream_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base_tags=$BASE_TAGS" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.name }}
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64,    goarm: "",  name: linux-amd64 }
          - { goos: linux, goarch: arm64,    goarm: "",  name: linux-arm64 }
          - { goos: linux, goarch: arm,      goarm: "7", name: linux-armv7 }
          - { goos: linux, goarch: arm,      goarm: "6", name: linux-armv6 }
          - { goos: linux, goarch: riscv64,  goarm: "",  name: linux-riscv64 }
          - { goos: linux, goarch: mipsle,   goarm: "",  name: linux-mipsle-softfloat,   gomips: softfloat }
          - { goos: linux, goarch: mips,     goarm: "",  name: linux-mips-softfloat,     gomips: softfloat }
          - { goos: linux, goarch: mips64le, goarm: "",  name: linux-mips64le-softfloat, gomips64: softfloat }
          - { goos: linux, goarch: mips64,   goarm: "",  name: linux-mips64-softfloat,   gomips64: softfloat }
          - { goos: darwin, goarch: amd64,   goarm: "",  name: darwin-amd64 }
          - { goos: darwin, goarch: arm64,   goarm: "",  name: darwin-arm64 }
          - { goos: windows, goarch: amd64,  goarm: "",  name: windows-amd64.exe }
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Clone upstream sing-box
        run: |
          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" src

      - name: Clone AmneziaWG wireguard-go fork
        run: |
          git clone --depth 1 --branch "$WIREGUARD_BRANCH" "$WIREGUARD_REPO" "$WIREGUARD_PATH"

      - name: Apply patches
        run: |
          cd src
          for patch in "$GITHUB_WORKSPACE"/patches/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          cd src
          BASE_TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          go build -v -trimpath \
            -tags "${BASE_TAGS},with_awg,with_xhttp" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=build-${{ github.run_number }}' ${LDFLAGS_SHARED} -s -w" \
            -o "$GITHUB_WORKSPACE/dist/sing-box-${{ matrix.name }}" \
            ./cmd/sing-box

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.name }}
          path: dist/*

  release:
    name: Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest build
          make_latest: true
          files: |
            dist/sing-box-*
            dist/SHA256SUMS
          prerelease: false
