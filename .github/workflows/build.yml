name: build

on:
  workflow_dispatch:
  schedule:
    # daily at 03:00 UTC
    - cron: "0 3 * * *"
  push:
    paths:
      - "patches/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/SagerNet/sing-box.git
  UPSTREAM_BRANCH: testing
  WIREGUARD_REPO: https://github.com/hb5588973/wireguard-go-awg.git
  WIREGUARD_BRANCH: main
  WIREGUARD_PATH: src/submodules/wireguard-go

jobs:
  meta:
    name: Resolve upstream revision and tags
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.meta.outputs.upstream_sha }}
      base_tags: ${{ steps.meta.outputs.base_tags }}
    steps:
      - name: Read upstream revision and default tags
        id: meta
        run: |
          set -euo pipefail
          SHA="$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" | cut -f1)"
          BASE_TAGS="$(curl -fsSL "https://raw.githubusercontent.com/SagerNet/sing-box/$UPSTREAM_BRANCH/release/DEFAULT_BUILD_TAGS_OTHERS")"
          test -n "$SHA"
          test -n "$BASE_TAGS"
          echo "upstream_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "base_tags=$BASE_TAGS" >> "$GITHUB_OUTPUT"
          echo "upstream: $SHA"
          echo "official default tags: $BASE_TAGS"

  build:
    name: build ${{ matrix.name }}
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # === 主流架构：支持 NaiveProxy ===
          - { goos: linux, goarch: amd64,    goarm: "",  name: linux-amd64,     naive: "true" }
          - { goos: linux, goarch: arm64,    goarm: "",  name: linux-arm64,     naive: "true" }
          - { goos: linux, goarch: arm,      goarm: "7", name: linux-armv7,     naive: "true" }
          - { goos: darwin, goarch: arm64,   goarm: "",  name: darwin-arm64,    naive: "true" }
          - { goos: windows, goarch: amd64,  goarm: "",  name: windows-amd64.exe, naive: "true" }
          
          # === 路由器/小众架构：剔除 NaiveProxy 以保证编译通过 ===
          - { goos: linux, goarch: arm,      goarm: "6", name: linux-armv6,     naive: "false" }
          - { goos: linux, goarch: riscv64,  goarm: "",  name: linux-riscv64,   naive: "false" }
          - { goos: linux, goarch: mipsle,   goarm: "",  name: linux-mipsle-softfloat,   gomips: softfloat, naive: "false" }
          - { goos: linux, goarch: mips,     goarm: "",  name: linux-mips-softfloat,     gomips: softfloat, naive: "false" }
          - { goos: linux, goarch: mips64le, goarm: "",  name: linux-mips64le-softfloat, gomips64: softfloat, naive: "false" }
          - { goos: linux, goarch: mips64,   goarm: "",  name: linux-mips64-softfloat,   gomips64: softfloat, naive: "false" }
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4

      - name: Clone upstream sing-box
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$UPSTREAM_BRANCH" "$UPSTREAM_REPO" src

      - name: Clone AmneziaWG wireguard-go fork
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$WIREGUARD_BRANCH" \
            "$WIREGUARD_REPO" \
            "$WIREGUARD_PATH"
          git -C "$WIREGUARD_PATH" log --oneline -1

      - name: Apply patches
        run: |
          set -euo pipefail
          cd src
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE"/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "::error::no patches found"
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "::group::apply $(basename "$patch")"
            git apply --check "$patch"
            git apply "$patch"
            echo "::endgroup::"
          done

      - name: Assert masque sources are present
        run: |
          set -euo pipefail
          test -f src/protocol/masque/outbound.go
          test -f src/transport/masque/connectip/connectip.go
          grep -q 'TypeMASQUE' src/constant/proxy.go
          grep -q 'masque.RegisterOutbound' src/include/registry.go

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache: true
          cache-dependency-path: src/go.sum

      - name: Compute build tags
        run: |
          set -euo pipefail
          BASE_TAGS="$(cat src/release/DEFAULT_BUILD_TAGS_OTHERS)"
          FINAL_TAGS="${BASE_TAGS},with_awg"
          
          if [ "${{ matrix.naive }}" = "true" ]; then
            FINAL_TAGS="${FINAL_TAGS},with_naive_outbound,with_purego"
          fi
          
          echo "BASE_TAGS=${BASE_TAGS}" >> "$GITHUB_ENV"
          echo "FINAL_TAGS=${FINAL_TAGS}" >> "$GITHUB_ENV"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GOMIPS64: ${{ matrix.gomips64 }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          cd src
          LDFLAGS_SHARED="$(cat release/LDFLAGS)"
          go build -v -trimpath \
            -tags "${FINAL_TAGS}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=build-${{ github.run_number }}' ${LDFLAGS_SHARED} -s -w" \
            -o "$GITHUB_WORKSPACE/dist/sing-box-${{ matrix.name }}" \
            ./cmd/sing-box

      # === 新增：UPX 压缩与 YAT 打包 ===
      - name: UPX Compress and Package
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/dist"
          BIN="sing-box-${{ matrix.name }}"
          
          # 1. 尝试 UPX 压缩（UPX 不支持部分小众架构，失败则跳过不报错）
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" != "mips64" ] && [ "${{ matrix.goarch }}" != "mips64le" ] && [ "${{ matrix.goarch }}" != "riscv64" ]; then
            echo "Running UPX on $BIN..."
            sudo apt-get update && sudo apt-get install -y upx
            upx -9 "$BIN" || echo "UPX compression failed or unsupported, continuing with original binary."
          fi

          # 2. 压缩成 .yat.gz (即 tar.gz)
          # 如果是 Windows 产物，不进行 YAT 打包；如果是 Linux，执行 tar.gz 并改名为 .yat
          if [ "${{ matrix.goos }}" = "linux" ]; then
            echo "Packaging $BIN to YAT..."
            tar -czvf "sing-box-${{ matrix.name }}.yat.gz" "$BIN"
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ matrix.name }}
          path: |
            dist/sing-box-${{ matrix.name }}
            dist/sing-box-${{ matrix.name }}.yat.gz
          if-no-files-found: error

  release:
    name: Release
    needs: [meta, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: List binaries
        run: ls -l dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest build
          make_latest: true
          body: |
            Automated build of SagerNet/sing-box `${{ needs.meta.outputs.upstream_sha }}` (`testing`) with
            AmneziaWG (`with_awg`) and MASQUE CONNECT-IP (untagged).

            **Supported Features by Platform:**
            - Linux amd64, arm64, armv7, macOS arm64, Windows amd64: NaiveProxy enabled.
            - Linux armv6, riscv64, mipsle, mips, mips64le, mips64: NaiveProxy disabled.

            Binaries are packed as `.yat.gz` (tar.gz) for Linux where applicable.
          files: |
            dist/sing-box-*
          prerelease: false
